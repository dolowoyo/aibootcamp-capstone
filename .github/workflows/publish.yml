name: Publish

# Builds and pushes the app image to GHCR on every tag push, then scans it with Trivy.
# This is what makes `infra/terraform`'s `docker_image.app` resource pullable — see
# docs/adr/0003-local-iac.md. Tags are the only trigger: `main` pushes alone never
# publish, so an unreviewed commit can't reach the registry.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dolowoyo/aibootcamp-capstone

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU (for cross-building linux/arm64 on this amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Without this, build-push-action defaults to the runner's own architecture
          # (amd64 on GitHub-hosted runners) -- found via `terraform apply`/`docker pull`
          # failing with "no matching manifest for linux/arm64/v8" on Apple Silicon, the
          # actual machine this capstone's local IaC (infra/terraform, docs/adr/
          # 0003-local-iac.md) is meant to run on. Buildx + QEMU cross-builds both from one
          # amd64 runner.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
