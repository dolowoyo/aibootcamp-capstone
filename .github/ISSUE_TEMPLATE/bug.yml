name: Bug
description: Something isn't working as the spec describes.
labels: ["bug"]
body:
  - type: input
    id: spec
    attributes:
      label: Related spec / AC (if applicable)
      placeholder: SPEC-001, AC-1.2
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
