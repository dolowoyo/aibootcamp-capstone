name: aibootcamp-capstone

# Single source of truth for the Postgres connection string, shared via YAML anchor by
# both `migrate` and `app` below -- avoids the two silently drifting if credentials ever
# change in only one place (found during task review, PLAN-004 Task 6).
x-database-url: &database-url postgresql://first90:first90@postgres:5432/first90?schema=public

# Local dev / demo stack: app + postgres 16 + otel-collector.
#
# Inference: LLM_PROVIDER defaults to `fixture` (no host process needed to bring this
# stack up at all). Set LLM_PROVIDER=sidecar to route the app's inference calls to a
# host-side `services/inference-sidecar` process (docs/adr/0001-inference-boundary.md) —
# that process is NOT part of this compose file by design: the Agent SDK it wraps
# authenticates via the macOS keychain + `claude` CLI subprocess, neither of which exists
# inside a container. Run it separately on the host: `node services/inference-sidecar/index.js`.
# `extra_hosts` below is what makes `host.docker.internal:8787` resolve from inside the
# app container back to that host process.

services:
  # One-off: applies prisma/schema.prisma to postgres, then exits. Runs from the `builder`
  # stage (not `app`'s own runner image) because the runner is deliberately minimal --
  # Next's file-tracing for `output: standalone` only includes what the compiled server
  # bundle actually requires at runtime, which never includes the `prisma` CLI or the raw
  # `schema.prisma` file (only invoked as a separate process, never `require()`d). The
  # builder stage already has both, so it's the natural place to run this rather than
  # bloating the runner image just to fit a one-time setup step. `db push` (not `migrate
  # deploy`) is deliberate: no migration history exists yet in this project, and a single
  # demo database with no real data (docs/constitution.md principle VII) doesn't need
  # migration-file provenance -- `--accept-data-loss` is safe here for the same reason.
  # Found necessary during Block 3 integration: nothing in this repo had ever applied the
  # schema to a real database before, so every repository call failed with "relation does
  # not exist" the first time real persistence (not just readyz's tableless SELECT 1) was
  # exercised against a fresh Postgres.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "db", "push", "--accept-data-loss", "--skip-generate", "--schema=./app/prisma/schema.prisma"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      INFERENCE_SIDECAR_URL: http://host.docker.internal:8787
      DATABASE_URL: *database-url
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_ENV: production
    extra_hosts:
      # Docker Desktop on macOS resolves this automatically; kept explicit for parity
      # with Linux hosts where it must be declared (host-gateway).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: first90
      POSTGRES_PASSWORD: first90
      POSTGRES_DB: first90
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U first90 -d first90"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  postgres-data:
